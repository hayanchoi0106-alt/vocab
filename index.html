<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com https://generativelanguage.googleapis.com https://api.dictionaryapi.dev https://api.mymemory.translated.net; base-uri 'none'; form-action 'none'">
<!--PREVIEW_META-->
<title>보카박스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보카박스">
<meta name="theme-color" content="#EEF4F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a ruled pocket notebook. Word left of the teal margin line, meaning in teal ink on the right, hidden by a teal cover sheet. */
:root{
  --paper:#EEF4F4; --page:#FCFEFD; --ink:#16283A; --ink2:#50646F; --rule:#CBDDDD; --margin:#7FC8BF;
  --accent:#0F766E; --sheet:#0F766E; --on-sheet:#F0FDFA; --tint:#D3EFEB; --warn:#9A5B00; --toast-btn:#5EEAD4;
  --hl1:#8A6A00; --hl2:#B4530F; --hl3:#A92B2B; --hl-ink:#FFFFFF;
  --cal:rgba(15,118,110,.5);
  --body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1A22; --page:#16252E; --ink:#E6F0F0; --ink2:#9DB3B8; --rule:#29404A; --margin:#2F6A65;
  --accent:#4FD1C5; --sheet:#0F766E; --on-sheet:#F0FDFA; --tint:#17403F; --warn:#F2B84B; --toast-btn:#0F766E;
  --hl1:#8F6F00; --hl2:#B4530F; --hl3:#B8312F; --hl-ink:#FFFFFF;
  --cal:rgba(20,184,166,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A22; --page:#16252E; --ink:#E6F0F0; --ink2:#9DB3B8; --rule:#29404A; --margin:#2F6A65;
  --accent:#4FD1C5; --sheet:#0F766E; --on-sheet:#F0FDFA; --tint:#17403F; --warn:#F2B84B; --toast-btn:#0F766E;
  --hl1:#8F6F00; --hl2:#B4530F; --hl3:#B8312F; --hl-ink:#FFFFFF;
  --cal:rgba(20,184,166,.5); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--body);font-weight:700;letter-spacing:-.01em;text-wrap:balance}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 18px/1 var(--body)}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);min-height:32px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink2);flex:none}
.status.ok i{background:var(--accent)}.status.bad i{background:var(--warn)}.status.busy i{background:#D99A1E}
main{padding-block:0 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:820px;width:100%;margin-inline:auto;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--page);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{padding:11px 4px 12px;text-align:center;font-size:14px;font-weight:500;color:var(--ink2)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600;box-shadow:inset 0 2px 0 var(--accent)}
@media (min-width:900px){
  .app{grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto 1fr}
  .topbar{grid-column:1/3}
  nav.tabs{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;background:none;border:0;padding:12px 0 0 16px;gap:2px}
  nav.tabs button{text-align:left;padding:9px 12px;font-size:15px}
  nav.tabs button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
  main{padding-bottom:48px;margin-left:0}
}

.dayhead{display:flex;align-items:center;gap:6px;padding-block:6px 14px}
.dayhead h1{font-size:clamp(25px,6vw,34px);line-height:1.2;flex:1;min-width:0}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;font-size:22px;color:var(--ink2);text-align:center}
.icon:hover{background:var(--page)}
.today-link{font-size:14px;color:var(--accent);font-weight:500;padding:8px}

.add{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto;gap:8px;margin-bottom:14px}
.add input,.field input,.field textarea,.search{width:100%;min-width:0;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:11px 12px;font-size:16px}
.add input:focus,.field input:focus,.field textarea:focus,.search:focus{outline:2px solid var(--ink);outline-offset:-1px}
.add #word{font-family:var(--body);font-weight:600}
.btn{background:var(--ink);color:var(--page);border-radius:4px;padding:11px 18px;font-weight:600;text-align:center;white-space:nowrap}
.btn.strong{background:var(--sheet);color:var(--on-sheet)}
.btn.line{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:560px){.add{grid-template-columns:minmax(0,1fr) auto}.add #word{grid-column:1/3}}

.memo{position:relative;margin-bottom:14px}
.memo textarea{display:block;width:100%;min-height:68px;resize:none;background:var(--page);border:1px solid var(--rule);border-radius:4px;padding:10px 12px 24px;font-size:16px;line-height:1.5}
.memo textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.memo output{position:absolute;right:10px;bottom:5px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.memo output.full{color:var(--warn);font-weight:600}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 14px;margin-bottom:14px;background:var(--sheet);color:var(--on-sheet);border-radius:4px;font-weight:500}

.notebook{list-style:none;margin:0;padding:0;background:var(--page);border:1px solid var(--rule);border-radius:4px;position:relative;overflow:hidden}
.notebook::before{content:"";position:absolute;top:0;bottom:0;left:42px;width:1px;background:var(--margin)}
.row{display:grid;grid-template-columns:42px minmax(0,1fr);border-bottom:1px solid var(--rule);position:relative}
.row:last-child{border-bottom:0}
.tick{width:42px;min-height:48px;display:grid;place-items:center}
.tick span{width:20px;height:20px;border:1.5px solid var(--ink2);border-radius:50%;display:grid;place-items:center;font-size:13px;color:transparent}
.done .tick span{background:var(--ink2);color:var(--page)}
.entry{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:2px 14px;padding:11px 14px;width:100%;min-width:0}
.entry:hover{background:color-mix(in srgb,var(--paper) 55%,transparent)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 7px;min-width:0}
.w{font:600 18px/1.35 var(--body);overflow-wrap:anywhere;padding-inline:4px;margin-inline:-4px;border-radius:2px}
.t1{background:var(--hl1);color:var(--hl-ink)}.t2{background:var(--hl2);color:var(--hl-ink)}.t3{background:var(--hl3);color:var(--hl-ink)}
.n{font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mean{min-width:0;overflow-wrap:anywhere}
.pos{font-size:13px;color:var(--ink2);margin-right:5px}
.ko{color:var(--accent);font-weight:500}
.ex{grid-column:2;font-size:14px;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.ex em{display:block;font-style:normal;font-size:13px;opacity:.85}
.done .w{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.done .w,.done .mean,.done .ex{opacity:.62}
.wait{color:var(--ink2);font-size:14px}
.chips{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 11px}
.chip{font-size:13px;padding:5px 9px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink2);font-variant-numeric:tabular-nums;background:none}
.chip:hover{color:var(--ink)}
.empty{padding:26px 18px 26px 58px;color:var(--ink2)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,40%{background:var(--tint)}100%{background:transparent}}

.seg{display:flex;gap:18px;margin-bottom:12px;border-bottom:1px solid var(--rule);overflow-x:auto}
.seg button{padding:9px 1px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.seg b{font-weight:500;font-variant-numeric:tabular-nums}
.search{margin-bottom:12px}
.pagetitle{font-size:clamp(25px,6vw,34px);padding-block:6px 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-bottom:12px}
.legend span span{padding-inline:6px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:13px;color:var(--ink2);text-align:center;padding-block:4px}
.day{aspect-ratio:1/1;background:var(--page);padding:6px;display:flex;flex-direction:column;justify-content:space-between;border-radius:3px;font-variant-numeric:tabular-nums;font-size:14px;min-width:0}
.day.blank{background:none}
.day.on{background:var(--cal)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day small{font-size:12px;font-weight:600;align-self:flex-end}
@media (max-width:420px){.day{padding:4px}}

.section{margin-bottom:30px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sechead h2{font-size:21px}
.drill{list-style:none;margin:0;padding:0;background:var(--page);border:1px solid var(--rule);border-radius:4px;position:relative;overflow:hidden}
.drill li{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);position:relative}
.drill li+li{border-top:1px solid var(--rule)}
.drill .a,.drill .b{padding:11px 14px;min-height:48px}
.drill .b{background:var(--page)}
.drill .cover-sheet{position:absolute;top:0;bottom:0;right:0;left:40%;background:var(--sheet);opacity:.95;transition:transform .32s cubic-bezier(.2,.8,.2,1);pointer-events:none;box-shadow:-6px 0 14px rgba(6,60,56,.22)}
.drill:not(.covered) .cover-sheet{transform:translateX(104%)}
.drill .b .mean{transition:opacity 0s .2s}
.drill.covered li:not(.peek) .b .mean{opacity:0}
.drill.covered li.peek .b{position:relative;z-index:2}
.hint{font-size:14px;color:var(--ink2);margin:8px 0 0}

.setup{display:grid;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px;background:var(--page);border:1px solid var(--rule);border-radius:4px;font-weight:500}
.opt span{color:var(--ink2);font-weight:400;font-variant-numeric:tabular-nums}
.opt[disabled]{opacity:.5;cursor:default}
.card{background:var(--page);border:1px solid var(--rule);border-radius:6px;overflow:hidden;display:grid;grid-template-rows:minmax(150px,auto) minmax(170px,auto);width:100%;position:relative}
.card .q{padding:28px 18px;display:grid;place-items:center;text-align:center;border-bottom:1px solid var(--margin)}
.card .q .w{font-size:clamp(30px,8vw,44px);line-height:1.2}
.card .q .n{display:block;margin-top:6px}
.card .a{padding:20px 18px;position:relative;overflow:hidden;text-align:center;display:grid;align-content:center;gap:8px}
.card .a .ko{font-size:21px}
.card .a .ex{font-size:15px;grid-column:auto}
.card .cover{position:absolute;inset:0;background:var(--sheet);color:var(--on-sheet);display:grid;place-items:center;font-weight:500;width:100%;text-align:center;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.card.open .cover{transform:translateY(102%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s}
.cardbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2);margin-bottom:8px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.actions .btn{white-space:normal;padding-inline:6px}

dialog{border:0;border-radius:6px;background:var(--page);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(15,24,42,.5)}
.dlg{padding:20px;display:grid;gap:13px}
.dlg h2{font-size:24px;overflow-wrap:anywhere}
.dlg h3{font-size:17px;margin-top:8px}
.field{display:grid;gap:4px;font-size:14px;color:var(--ink2)}
.field input,.field textarea{color:var(--ink)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:14px;color:var(--ink2);margin:0}
.err{font-size:14px;color:var(--warn);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--page);padding:10px 14px;border-radius:4px;display:flex;gap:14px;align-items:center;font-size:15px;width:max-content;max-width:calc(100vw - 32px)}
.toast button{color:var(--toast-btn);font-weight:600;white-space:nowrap}
.banner{background:var(--tint);color:var(--ink);padding:9px 12px;border-radius:4px;font-size:14px;margin-bottom:12px}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">보카박스</span>
    <button class="status" id="status" data-act="settings" aria-label="동기화 상태와 설정 열기"><i></i><span id="statusText">이 기기에만 저장</span></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="화면 이동">
    <button data-tab="diary">일기장</button>
    <button data-tab="cal">달력</button>
    <button data-tab="review">복습</button>
    <button data-tab="box">단어 모음</button>
  </nav>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden role="status"></div>
<script>
'use strict';
/* ---------- storage ---------- */
const PREVIEW=!!window.__VOCAB_PREVIEW__;
const DATA_KEY=PREVIEW?'vocab.preview.data':'vocab.data', CFG_KEY=PREVIEW?'vocab.preview.cfg':'vocab.cfg';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const FILE='vocab.json';
const MEMO_MAX=140;
const empty=()=>({v:1,words:{},entries:{},notes:{}});
let S=store.get(DATA_KEY)||empty();
let cfg=store.get(CFG_KEY)||{};
S.notes=S.notes||{};
const saveCfg=()=>store.set(CFG_KEY,cfg);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm=w=>w.trim().replace(/\s+/g,' ').toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const DOW='일월화수목금토';
const longDate=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`};
const shortDate=s=>{const d=parse(s);return `${d.getMonth()+1}/${d.getDate()}`};
const dayLabel=s=>{if(s===today())return'오늘';if(s===shift(today(),-1))return'어제';return longDate(s)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- derived index ---------- */
let byDate={}, byKey={};
function reindex(){
  byDate={};byKey={};
  for(const[id,e]of Object.entries(S.entries)){
    if(e.del||!S.words[e.k])continue;
    (byKey[e.k]=byKey[e.k]||new Set()).add(e.d);
    const day=byDate[e.d]=byDate[e.d]||{};
    if(!day[e.k]||e.at<day[e.k].at)day[e.k]={...e,id};
  }
}
const datesOf=k=>[...(byKey[k]||[])].sort();
const keysOn=d=>Object.values(byDate[d]||{}).sort((a,b)=>a.at-b.at).map(e=>e.k);
const liveKeys=()=>Object.keys(byKey);
const learning=()=>liveKeys().filter(k=>S.words[k].st!=='mastered');
const hard=()=>learning().filter(k=>byKey[k].size>=2);
const prevDay=()=>Object.keys(byDate).filter(d=>d<today()&&keysOn(d).length).sort().pop()||null;

/* ---------- merge: two devices can edit offline, nothing gets lost ---------- */
function merge(a,b){
  const out=empty();
  for(const k of new Set([...Object.keys(a.words),...Object.keys(b.words)])){
    const x=a.words[k],y=b.words[k];
    if(!x||!y){out.words[k]={...(x||y)};continue}
    const meta=(x.metaAt||0)>=(y.metaAt||0)?x:y, st=(x.stAt||0)>=(y.stAt||0)?x:y;
    out.words[k]={...meta,st:st.st,stAt:st.stAt};
  }
  for(const id of new Set([...Object.keys(a.entries),...Object.keys(b.entries)])){
    const x=a.entries[id],y=b.entries[id];
    if(!x||!y){out.entries[id]={...(x||y)};continue}
    const del=Math.max(x.del||0,y.del||0);
    out.entries[id]=del?{...x,del}:{...x};
  }
  const an=a.notes||{},bn=b.notes||{};
  for(const d of new Set([...Object.keys(an),...Object.keys(bn)])){
    const x=an[d],y=bn[d];
    out.notes[d]=!x?y:!y?x:(x.at>=y.at?x:y);
  }
  return out;
}
function stable(o){
  if(Array.isArray(o))return'['+o.map(stable).join(',')+']';
  if(o&&typeof o==='object')return'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
  return JSON.stringify(o)??'null';
}

/* ---------- ui state ---------- */
let tab='diary', day=today(), calMonth=null, boxTab='hard', query='', covered=true;
let session=null, draft={word:'',mean:''}, flashKey=null;
const peeks=new Set();
const fillState={};

const memoOf=d=>S.notes[d]?.t||'';
function commit(){reindex();store.set(DATA_KEY,S);render();scheduleSync()}
function setMeta(w,patch){Object.assign(w,patch);w.metaAt=Date.now()}
function setStatus(w,st){w.st=st;w.stAt=Date.now()}

/* ---------- word actions ---------- */
function addWord(text,mine,date){
  const k=norm(text); if(!k)return;
  if((byDate[date]||{})[k]){flashKey=k;toast('이 날짜에 이미 적은 단어임');render();return}
  let w=S.words[k];
  if(!w){w=S.words[k]={w:text.trim().replace(/\s+/g,' '),pos:'',ko:'',ex:'',exKo:'',mine:false,st:'learning',stAt:0,metaAt:Date.now()}}
  if(mine)setMeta(w,{ko:mine.trim(),mine:true});
  let msg='';
  const before=(byKey[k]?.size||0);
  if(w.st==='mastered'){setStatus(w,'learning');msg='암기 완료 단어를 다시 적어 못 외운 단어로 변경함'}
  else if(before>=1)msg=`${before+1}번째 적은 단어임`;

const POS={noun:'명사',verb:'동사',adjective:'형용사',adverb:'부사',pronoun:'대명사',preposition:'전치사',conjunction:'접속사',interjection:'감탄사',exclamation:'감탄사'};
async function net(url,opt={},ms=20000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}
}
const GEMINI='https://generativelanguage.googleapis.com/v1beta';
let modelQueue=null, aiError='';
function score(id){
  let s=id.includes('flash-lite')?1000:500;
  const m=id.match(/(\d+)\.(\d+)/); if(m)s+=Number(m[1])*10+Number(m[2]);
  return s;
}
async function geminiModels(){
  if(modelQueue)return modelQueue;
  const fallback=['gemini-2.5-flash-lite','gemini-2.5-flash'];
  let list=[];
  try{
    const r=await net(`${GEMINI}/models?pageSize=200`,{headers:{'x-goog-api-key':cfg.gemini}});
    if(r.status===400||r.status===401||r.status===403)throw Object.assign(new Error('key'),{fatal:true});
    if(r.ok){
      const j=await r.json();
      list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>m.name.replace('models/','')).filter(n=>/^gemini-.*flash/.test(n)&&!/preview|exp|image|tts|live|audio|robotics|embed|omni|thinking|computer/.test(n));
      list.sort((a,b)=>score(b)-score(a));
    }
  }catch(e){if(e.fatal)throw e}
  modelQueue=[...new Set([cfg.model,...list,...fallback].filter(Boolean))].slice(0,6);
  return modelQueue;
}
function parseJSON(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error('응답 형식 오류');return JSON.parse(m[0])}
async function fromGemini(word,mine){
  const prompt=`You help a Korean adult learning English keep a vocabulary notebook. Look up the English word or phrase given as JSON below.
Reply with JSON only, with exactly these keys:
{"pos":"Korean part of speech, e.g. 동사. Use 명사, 동사 when it has two common ones. Use 숙어 for an idiom or phrase.","ko":"1 to 3 common Korean meanings, comma separated, short","example":"one natural English sentence of 8 to 14 words using it","example_ko":"natural Korean translation of the sentence"}
${mine?'Use this meaning the learner wrote for the example: '+JSON.stringify(mine):''}
Input: ${JSON.stringify(word)}`;
  const body=JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:2048}});
  const models=await geminiModels();
  let last='';
  for(const model of models){
    let r;
    try{r=await net(`${GEMINI}/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.gemini},body})}
    catch{last='네트워크 오류';continue}
    if(r.ok){
      const j=await r.json();
      const text=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
      try{
        const o=parseJSON(text);
        if(!o.ko)throw new Error('뜻 없음');
        if(cfg.model!==model){cfg.model=model;saveCfg()}
        aiError='';
        return{pos:o.pos||'',ko:o.ko,ex:o.example||'',exKo:o.example_ko||''};
      }catch(e){last=e.message;continue}
    }
    last=`${model}: ${r.status}`;
    if(r.status===400||r.status===401){const t=await r.text();if(/API.?key/i.test(t))throw new Error('Gemini 키가 올바르지 않음');}
  }
  throw new Error(last||'Gemini 응답 없음');
}
async function memory(text){
  const r=await net(`https://api.mymemory.translated.net/get?langpair=en%7Cko&q=${encodeURIComponent(text)}`);
  if(!r.ok)return'';
  const j=await r.json();
  const t=j.responseData?.translatedText||'';
  return j.responseStatus===200&&t&&!/MYMEMORY WARNING|QUERY LENGTH/i.test(t)&&t.toLowerCase()!==text.toLowerCase()?t:'';
}
async function fromFree(word){
  const out={pos:'',ko:'',ex:'',exKo:''};
  try{
    const r=await net(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if(r.ok){
      const j=await r.json();
      const ms=j.flatMap(e=>e.meanings||[]);
      out.pos=[...new Set(ms.map(m=>POS[m.partOfSpeech]).filter(Boolean))].slice(0,2).join(', ');
      out.ex=ms.flatMap(m=>m.definitions||[]).map(d=>d.example).find(Boolean)||'';
    }
  }catch{}
  try{out.ko=await memory(word)}catch{}
  if(out.ex){try{out.exKo=await memory(out.ex)}catch{}}
  return out;
}
const queue=[]; let filling=false;
function enqueue(k){
  const w=S.words[k];
  if(!w||(w.pos&&w.ko&&w.ex)||fillState[k]==='fail'||queue.includes(k))return;
  fillState[k]='wait';queue.push(k);renderSoft();runQueue();
}
async function runQueue(){
  if(filling)return; filling=true;
  while(queue.length){
    const k=queue.shift(), w=S.words[k];
    if(!w)continue;
    let res=null;
    if(!PREVIEW){
      if(cfg.gemini){try{res=await fromGemini(w.w,w.mine?w.ko:'')}catch(e){aiError=e.message;modelQueue=null}}
      if(!res||!res.ko)res=await fromFree(w.w);
    }
    const cur=S.words[k]; if(!cur)continue;
    if(res&&(res.ko||res.pos||res.ex)){
      setMeta(cur,{pos:cur.pos||res.pos,ko:cur.mine?cur.ko:(cur.ko||res.ko),ex:cur.ex||res.ex,exKo:cur.exKo||res.exKo});
      delete fillState[k];
      if(!cur.ko)fillState[k]='fail';
      else if(!cur.pos||!cur.ex)fillState[k]='partial'; // stop asking again this session
      commit();
    }else{fillState[k]='fail';render()}
    if(cfg.gemini&&queue.length)await new Promise(r=>setTimeout(r,900));
  }
  filling=false;
}

/* ---------- GitHub sync ---------- */
const connected=()=>!!(cfg.owner&&cfg.repo&&cfg.token)&&!PREVIEW;
const API=()=>`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${FILE}`;
const authH=a=>({Authorization:`Bearer ${cfg.token}`,Accept:a||'application/vnd.github+json'});
const toB64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o)};
const fromB64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghError(status){
  if(status===401)return'GitHub 토큰이 잘못됐거나 만료됨. 설정에서 새 토큰 입력 필요';
  if(status===403)return'토큰 권한 부족. Contents를 Read and write로 설정 필요';
  if(status===404)return'저장소를 찾지 못함. 저장소 이름과 토큰 설정 확인 필요';
  return`GitHub 오류 (${status})`;
}
async function ghGet(){
  const r=await net(API(),{headers:authH(),cache:'no-store'});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw Object.assign(new Error(ghError(r.status)),{status:r.status});
  const j=await r.json();
  let text;
  if(j.content)text=fromB64(j.content);
  else{ // over 1MB: GitHub leaves content empty, so ask for the raw file
    const raw=await net(API(),{headers:authH('application/vnd.github.raw+json'),cache:'no-store'},40000);
    if(!raw.ok)throw new Error(ghError(raw.status));
    text=await raw.text();
  }
  return{data:JSON.parse(text),sha:j.sha};
}
async function ghPut(data,sha){
  const body={message:`단어장 업데이트 ${today()}`,content:toB64(JSON.stringify(data))};
  if(sha)body.sha=sha;
  return net(API(),{method:'PUT',headers:{...authH(),'Content-Type':'application/json'},body:JSON.stringify(body)},40000);
}
let syncing=false, again=false, syncTimer=null, lastSync=0, syncMsg='';
function scheduleSync(){if(!connected())return;paintStatus('busy','저장 대기');clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,2500)}
async function syncNow(){
  if(!connected())return paintStatus();
  if(syncing){again=true;return}
  syncing=true;again=false;paintStatus('busy','동기화 중');
  try{
    let done=false;
    for(let i=0;i<5&&!done;i++){
      const{data,sha}=await ghGet();
      const merged=merge(S,data||empty());
      const changedLocal=stable(merged)!==stable(S);
      S=merged;
      if(changedLocal){reindex();store.set(DATA_KEY,S);renderSoft();Object.keys(S.words).forEach(enqueue)}
      if(data&&stable(merged)===stable(data)){done=true;break}
      const p=await ghPut(merged,sha);
      if(p.ok){done=true;break}
      if(p.status!==409&&p.status!==422)throw new Error(ghError(p.status));
      await new Promise(r=>setTimeout(r,400*(i+1)));
    }
    if(!done)throw new Error('다른 기기와 저장이 겹침. 잠시 후 다시 시도 필요');
    lastSync=Date.now();syncMsg='';paintStatus('ok','저장됨');
  }catch(e){
    const off=e.name==='AbortError'||e instanceof TypeError;
    syncMsg=off?'연결 끊김. 이 기기에 저장됨. 재연결 시 자동 업로드':e.message;
    paintStatus('bad',off?'오프라인':'동기화 오류');
  }finally{
    syncing=false;
    if(again){again=false;scheduleSync()}
  }
}

  viewKey=key;
  if($('#word')){draft.word=$('#word').value;draft.mean=$('#mine').value}
  document.querySelectorAll('#tabs button').forEach(b=>b.dataset.tab===tab?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  $('#view').innerHTML=VIEWS[tab]();
  if(id&&document.getElementById(id)&&['word','mine','memo','search'].includes(id)){const el=document.getElementById(id);el.focus();try{el.setSelectionRange(sel,sel)}catch{}}
  flashKey=null;
}
function renderSoft(){if(!$('#dlg').open)render()}

/* ---------- flashcards ---------- */
function startSession(scope){
  const p=prevDay();
  const keys=scope==='hard'?hard():scope==='prev'?keysOn(p).filter(k=>S.words[k].st!=='mastered'):learning();
  session={scope,q:shuffle(keys),total:keys.length,again:0,open:false};render();
}
function nextCard(fn){const k=session.q.shift();fn&&fn(k);session.open=false;render()}

/* ---------- dialogs ---------- */
function openWord(k,date){
  const w=S.words[k],d=$('#dlg');
  d.innerHTML=`<form class="dlg" id="wordForm" method="dialog" data-k="${esc(k)}" ${date?`data-d="${date}"`:''}>
    <h2>${esc(w.w)}</h2>
    <div class="row2">
      <label class="field">품사<input id="fPos" value="${esc(w.pos)}"></label>
      <label class="field">한국어 뜻<input id="fKo" value="${esc(w.ko)}"></label>
    </div>
    <label class="field">예문<textarea id="fEx" rows="2">${esc(w.ex)}</textarea></label>
    <label class="field">예문 해석<textarea id="fExKo" rows="2">${esc(w.exKo)}</textarea></label>
    <div><p class="note">적은 날 ${datesOf(k).length}번</p><div class="btns" style="margin-top:6px">${datesOf(k).reverse().map(x=>`<button type="button" class="chip" data-act="goto" data-d="${x}">${shortDate(x)}</button>`).join('')}</div></div>
    <div class="btns">
      <button type="submit" class="btn" value="save">저장</button>
      <button type="button" class="btn line" data-act="refill" data-k="${esc(k)}">자동으로 다시 찾기</button>
      <button type="button" class="btn line" data-act="del" data-k="${esc(k)}" data-d="${date||''}">${date?'이 날짜에서 지우기':'단어 지우기'}</button>
      <button type="button" class="btn line" data-act="close">닫기</button>
    </div></form>`;
  d.showModal();
}
function openSettings(){
  const d=$('#dlg');
  d.innerHTML=`<form class="dlg" id="setForm" method="dialog">
    <h2>설정</h2>
    ${PREVIEW?`<p class="note">미리보기에서는 연결 불가. 토큰은 GitHub에 올린 실제 앱에서만 입력.</p><div class="btns"><button type="button" class="btn line" data-act="close">닫기</button></div>`:`
    ${syncMsg?`<p class="err">${esc(syncMsg)}</p>`:''}
    <h3>GitHub 저장소</h3>
    <div class="row2">
      <label class="field">GitHub 아이디<input id="sOwner" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(cfg.owner||'')}"></label>
      <label class="field">데이터 저장소 이름<input id="sRepo" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="vocab-data" value="${esc(cfg.repo||'')}"></label>
    </div>
    <label class="field">GitHub 토큰<input id="sToken" type="password" autocomplete="off" value="${esc(cfg.token||'')}"></label>
    <h3>자동 채우기</h3>
    <label class="field">Gemini API 키 (비워두면 무료 사전 사용)<input id="sGemini" type="password" autocomplete="off" value="${esc(cfg.gemini||'')}"></label>
    ${aiError?`<p class="err">최근 Gemini 오류: ${esc(aiError)}</p>`:''}
    <div class="btns"><button type="submit" class="btn" value="save">저장하고 연결</button><button type="button" class="btn line" data-act="close">닫기</button></div>
    <h3>다른 기기 연결</h3>
    <p class="note">연결 코드에 토큰이 포함됨. 비밀번호처럼 관리 필요. 다른 기기에 붙여넣은 뒤 메모 삭제 권장.</p>
    <div class="btns"><button type="button" class="btn line" data-act="copycode" ${cfg.token?'':'disabled'}>연결 코드 복사</button></div>
    <label class="field">받은 연결 코드 붙여넣기<input id="sCode" autocomplete="off"></label>
    <div class="btns"><button type="button" class="btn line" data-act="applycode">이 기기 연결</button></div>
    <h3>백업</h3>
    <p class="note">GitHub 커밋 기록에 모든 버전이 저장됨. 파일로 별도 저장 가능.</p>
    <div class="btns"><button type="button" class="btn line" data-act="export">JSON 내려받기</button></div>`}
  </form>`;
  d.showModal();
}
function connect(c){Object.assign(cfg,c);modelQueue=null;saveCfg();$('#dlg').close();paintStatus();syncNow()}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download=`vocab-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
}
let toastT;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">되돌리기</button>':''}`;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,undo?5000:2600);
  if(undo)$('#undo').onclick=()=>{t.hidden=true;undo()};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;session=null;query='';if(tab==='diary')day=today();render();window.scrollTo(0,0);return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const{act,k,d,n}=b.dataset;
  if(act==='settings')openSettings();
  else if(act==='close')$('#dlg').close();
  else if(act==='toggle')toggle(k);
  else if(act==='open')openWord(k,d);
  else if(act==='goto'){if($('#dlg').open)$('#dlg').close();day=d;tab='diary';render();window.scrollTo(0,0)}
  else if(act==='day'){day=shift(day,Number(n));render()}
  else if(act==='today'){day=today();render()}
  else if(act==='tab'){tab=b.dataset.t;render();window.scrollTo(0,0)}
  else if(act==='month'){const cur=calMonth||today().slice(0,7);const[y,m]=cur.split('-').map(Number);const x=new Date(y,m-1+Number(n),1);calMonth=ymd(x).slice(0,7);render()}
  else if(act==='box'){boxTab=b.dataset.b;render()}
  else if(act==='cover'){covered=!covered;peeks.clear();const u=$('.drill');u&&u.classList.toggle('covered',covered);document.querySelectorAll('.drill li').forEach(l=>l.classList.remove('peek'));b.textContent=covered?'시트 치우기':'시트 덮기'}
  else if(act==='peek'){peeks.has(k)?peeks.delete(k):peeks.add(k);b.classList.toggle('peek')}
  else if(act==='start')startSession(b.dataset.s);
  else if(act==='stop'){session=null;render()}
  else if(act==='restart')startSession(session.scope);
  else if(act==='reveal'){session.open=true;render()}
  else if(act==='next')nextCard();
  else if(act==='again')nextCard(x=>{session.again++;const i=Math.min(session.q.length,2+Math.floor(Math.random()*Math.max(1,session.q.length-1)));session.q.splice(i,0,x)});
  else if(act==='del'){$('#dlg').close();removeEntries(k,d||null)}
  else if(act==='refill'){const w=S.words[k];setMeta(w,{pos:'',ko:'',ex:'',exKo:'',mine:false});delete fillState[k];$('#dlg').close();commit();enqueue(k)}
  else if(act==='copycode'){const code='vocab1:'+toB64(JSON.stringify({owner:cfg.owner,repo:cfg.repo,token:cfg.token,gemini:cfg.gemini||''}));
    navigator.clipboard.writeText(code).then(()=>toast('연결 코드 복사됨'),()=>{$('#sCode').value=code;$('#sCode').select();toast('아래 칸의 코드를 직접 복사 필요')})}
  else if(act==='applycode'){try{const raw=$('#sCode').value.trim().replace(/^vocab1:/,'');connect(JSON.parse(fromB64(raw)));toast('이 기기 연결됨')}catch{toast('연결 코드가 올바르지 않음')}}
  else if(act==='export')exportData();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act="peek"]')){e.preventDefault();e.target.click()}
  if(tab==='review'&&session&&session.q.length&&e.key===' '&&!session.open&&e.target.tagName!=='BUTTON'){e.preventDefault();session.open=true;render()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='addForm'){
    e.preventDefault();
    const word=$('#word').value,mean=$('#mine').value;
    if(!word.trim())return;
    $('#word').value='';$('#mine').value='';draft={word:'',mean:''};
    addWord(word,mean,day);$('#word')?.focus();
  }else if(e.target.id==='wordForm'){
    const k=e.target.dataset.k,w=S.words[k];
    const ko=$('#fKo').value.trim();
    setMeta(w,{pos:$('#fPos').value.trim(),ko,ex:$('#fEx').value.trim(),exKo:$('#fExKo').value.trim(),mine:ko!==w.ko?!!ko:w.mine});
    commit();
  }else if(e.target.id==='setForm'){
    e.preventDefault();
    connect({owner:$('#sOwner').value.trim(),repo:$('#sRepo').value.trim(),token:$('#sToken').value.trim(),gemini:$('#sGemini').value.trim()});
    toast('설정 저장됨');Object.keys(S.words).forEach(k=>{delete fillState[k];enqueue(k)});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){query=e.target.value;render()}
  if(e.target.id==='memo'){
    const t=e.target.value;S.notes[day]={t,at:Date.now()};store.set(DATA_KEY,S);scheduleSync();
    const c=$('#memoCount');c.textContent=`${t.length}/${MEMO_MAX}`;c.classList.toggle('full',t.length>=MEMO_MAX);
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSync>20000)syncNow()});
addEventListener('online',syncNow);
addEventListener('focus',()=>{if(Date.now()-lastSync>20000)syncNow()});

/* ---------- start ---------- */
if(PREVIEW&&!Object.keys(S.words).length&&window.__VOCAB_SEED__)S=window.__VOCAB_SEED__();
reindex();render();paintStatus();
Object.keys(S.words).forEach(enqueue);
syncNow();
if(!PREVIEW&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__vocabTest={merge,stable};
</script>
</body>
</html>
